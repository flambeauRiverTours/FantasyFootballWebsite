
version: 2

updates:
  # Restore runs from nuget.org only; there is no NuGet.config in the repo.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      azure-functions:
        patterns:
          - Microsoft.Azure.Functions.*
      opentelemetry:
        patterns:
          - OpenTelemetry.*
          - Azure.Monitor.OpenTelemetry.*
      xunit:
        patterns:
          - xunit*
    ignore:
      # 8.x moved to the Xceed Community Licence, which is non-commercial only.
      # Pinned deliberately; see the licence gate in security.yml.
      - dependency-name: FluentAssertions
        versions:
          - '>=8.0.0'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # one PR for routine updates; a major version still gets its own
      web-minor-and-patch:
        update-types:
          - minor
          - patch

  # the composite action pins actions too, and Dependabot reads only the
  # directories it is given
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/dotnet
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # init and analyze refuse to run at different versions, so they move together
      codeql:
        patterns:
          - github/codeql-action*

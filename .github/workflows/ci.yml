name: ci
# push is main only, so a branch with an open PR is not built twice
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site/**'

permissions:
  id-token: write
  contents: read

# a newer push to a PR cancels the older run; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # squash merging makes the PR title the commit on main (standards, domain 7)
  conventions:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Title and branch follow the conventions
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: |
          types='feat|fix|docs|test|refactor|build|ci|chore'
          status=0
          if ! [[ "$TITLE" =~ ^($types)(\([a-z0-9-]+\))?!?:\ .+ ]]; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit, e.g. 'fix: what changed'"
            status=1
          fi
          if ! [[ "$BRANCH" =~ ^($types)/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Branch '$BRANCH' is not type/short-description, e.g. 'fix/radar-colours'"
            status=1
          fi
          exit $status

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dotnet
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal
      - run: dotnet format --verify-no-changes

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # the standard's budget (domain 2): every script index.html loads before first paint
      - name: Initial JavaScript stays under 125 KB gzipped
        run: |
          total=0
          while read -r script; do
            total=$((total + $(gzip -9 -c "dist$script" | wc -c)))
          done < <(grep -oE '/assets/[^"]+\.js' dist/index.html | sort -u)
          echo "Initial JavaScript: $total bytes gzipped"
          if [ "$total" -gt 125000 ]; then
            echo "::error::Initial JavaScript is $total bytes gzipped, over the 125 KB budget"
            exit 1
          fi
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        run: |
          set -euo pipefail
          command -v shellcheck
          file=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -fsSL -o "$file" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$file"
          echo "$ACTIONLINT_SHA256  $file" | sha256sum -c -
          tar -xzf "$file" actionlint
          ./actionlint -color

  infra:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: what-if
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          EXCLUDED_OWNER_IDS: ${{ secrets.EXCLUDED_OWNER_IDS }}
          RESOURCE_GROUP:  ${{ secrets.AZ_RESOURCE_GROUP_NAME }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          SQL_ADMIN_ID: ${{ secrets.AZ_SQL_ADMIN_OBJECT_ID }}
          SQL_ADMIN_NAME: ${{ secrets.AZ_SQL_DB_ADMIN_NAME }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          OVERRIDE_LEAGUE_NAME: ${{ vars.OVERRIDE_LEAGUE_NAME }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters leagueId="$LEAGUE_ID" excludedOwnerIds="$EXCLUDED_OWNER_IDS" \
            alertEmail="$BUDGET_ALERT_EMAIL" sqlAdminObjectId="$SQL_ADMIN_ID" \
            sqlAdminLogin="$SQL_ADMIN_NAME" customDomain="${CUSTOM_DOMAIN_NAME:-}" \
            overrideLeagueName="${OVERRIDE_LEAGUE_NAME:-}"

name: security
on:
  schedule:
    - cron: '17 6 * * 1' # Monday 06:17 UTC, when the weekly Dependabot PRs are open
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/dotnet
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q 'has the following vulnerable packages' vulnerable.txt

      # advisory only: a deprecation is a migration to plan, not a defect
      - name: Deprecated packages
        continue-on-error: true
        run: |
          dotnet list package --deprecated 2>&1 | tee deprecated.txt
          ! grep -q 'has the following deprecated packages' deprecated.txt

      # the ignored natives are Microsoft's own (A15); overrides are pinned (A18)
      - name: Licences
        run: |
          dotnet tool install --global nuget-license --version 4.0.18
          nuget-license -i FantasyLeague.slnx -t -a 'MIT;MIT-0;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD' -mapping .github/license-url-mappings.json -override .github/license-overrides.json -ignore 'Microsoft.Data.SqlClient.SNI.runtime;Microsoft.Identity.Client.NativeInterop'

  # the web app: production vulnerabilities fail, as NuGet's do; licences are
  # checked for every package, build tools included, so a new one is caught early
  web-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Vulnerable packages
        working-directory: web
        run: npm audit --omit=dev --audit-level=low
      - name: Licences
        run: node scripts/check-npm-licences.mjs web/package-lock.json

  codeql:
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The OIDC identifiers are deliberately absent: federated credentials make
      # them public. Unknown credential shapes are Trivy's job, below.
      - name: No configured secrets in tracked files
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          EXCLUDED_OWNER_IDS: ${{ secrets.EXCLUDED_OWNER_IDS }}
        run: |
          found=0
          check() {
            name="$1"; value="$2"
            [ -z "$value" ] && return 0
            # a short value substring-matches ordinary prose; it is a
            # misconfigured secret, not a leak, and saying so beats a false alarm
            if [ "${#value}" -lt 12 ]; then
              echo "::warning::$name is shorter than 12 characters and was not searched for"
              return 0
            fi
            if git grep -nF -e "$value" -- . > /dev/null 2>&1; then
              # length and line numbers, never the value: GitHub masks the value,
              # which is what made the first failure of this gate unactionable
              echo "::error::$name (${#value} chars) appears in a tracked file (A2)"
              git grep -nF -e "$value" -- . | cut -d: -f1,2
              found=1
            fi
          }
          check LEAGUE_ID "$LEAGUE_ID"
          for owner in ${EXCLUDED_OWNER_IDS//,/ }; do
            check EXCLUDED_OWNER_IDS "$owner"
          done
          exit $found

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Trivy reads ARM JSON, not bicep, so compile first.
      - name: Compile bicep
        run: |
          mkdir -p arm
          az bicep build --file infra/main.bicep --outfile arm/main.json

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table

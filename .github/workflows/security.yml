name: security
on:
  schedule:
    - cron: '17 6 * * 1' #runs on Monday at 06:17 UTC, which is 01:17 EST/EDT, when the weekly dependabot PRs are open
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - run: dotnet restore
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q 'has the following vulnerable packages' vulnerable.txt

      # Advisory only: xunit 2.x is already flagged Legacy in favour of xunit.v3,
      # which is a migration rather than a security fix.
      - name: Deprecated packages
        continue-on-error: true
        run: |
          dotnet list package --deprecated 2>&1 | tee deprecated.txt
          ! grep -q 'has the following deprecated packages' deprecated.txt

      - name: Licences
        run: |
          dotnet tool install --global nuget-license
          nuget-license -i FantasyLeague.slnx -t -a 'MIT;Apache-2.0;BSD-3-Clause' -mapping .github/license-url-mappings.json -o JsonPretty > licenses.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-report
          path: |
            vulnerable.txt
            deprecated.txt
            licenses.json
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The OIDC identifiers are deliberately absent: federated credentials make
      # them public. Unknown credential shapes are Trivy's job, below.
      - name: No configured secrets in tracked files
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          EXCLUDED_OWNER_IDS: ${{ secrets.EXCLUDED_OWNER_IDS }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          found=0
          check() {
            name="$1"; value="$2"
            [ -z "$value" ] && return 0
            # a short value substring-matches ordinary prose; it is a
            # misconfigured secret, not a leak, and saying so beats a false alarm
            if [ "${#value}" -lt 12 ]; then
              echo "::warning::$name is shorter than 12 characters and was not searched for"
              return 0
            fi
            if git grep -nF -e "$value" -- . > /dev/null 2>&1; then
              # length and line numbers, never the value: GitHub masks the value,
              # which is what made the first failure of this gate unactionable
              echo "::error::$name (${#value} chars) appears in a tracked file (A2)"
              git grep -nF -e "$value" -- . | cut -d: -f1,2
              found=1
            fi
          }
          check LEAGUE_ID "$LEAGUE_ID"
          check AZURE_STATIC_WEB_APPS_API_TOKEN "$SWA_TOKEN"
          for owner in ${EXCLUDED_OWNER_IDS//,/ }; do
            check EXCLUDED_OWNER_IDS "$owner"
          done
          exit $found

      - name: Sleeper-shaped ids elsewhere
        continue-on-error: true #possibly false positives, so advisory only
        run: '! git grep -nE "[0-9]{18,20}" -- . ":!*lock.json"'

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Trivy reads ARM JSON, not bicep, so compile first.
      - name: Compile bicep
        run: |
          mkdir -p arm
          az bicep build --file infra/main.bicep --outfile arm/main.json

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table

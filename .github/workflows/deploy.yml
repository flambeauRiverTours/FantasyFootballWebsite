name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# never cancel a deploy mid-flight
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      functionAppName: ${{ steps.deploy.outputs.functionAppName }}
      functionAppUrl: ${{ steps.deploy.outputs.functionAppUrl }}
      staticWebAppName: ${{ steps.deploy.outputs.staticWebAppName }}
      staticWebAppUrl: ${{ steps.deploy.outputs.staticWebAppUrl }}
      sqlServerFqdn: ${{ steps.deploy.outputs.sqlServerFqdn }}
      sqlDatabaseName: ${{ steps.deploy.outputs.sqlDatabaseName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          EXCLUDED_OWNER_IDS: ${{ secrets.EXCLUDED_OWNER_IDS }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
          RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP_NAME }}
          SQL_ADMIN_ID: ${{ secrets.AZ_SQL_ADMIN_OBJECT_ID }}
          SQL_ADMIN_NAME: ${{ secrets.AZ_SQL_DB_ADMIN_NAME }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          OVERRIDE_LEAGUE_NAME: ${{ vars.OVERRIDE_LEAGUE_NAME }}
        run: |
          az deployment group create \
            --name deploy-${{ github.run_number }} \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters leagueId="$LEAGUE_ID" excludedOwnerIds="$EXCLUDED_OWNER_IDS" \
            alertEmail="$BUDGET_ALERT_EMAIL" sqlAdminObjectId="$SQL_ADMIN_ID" \
            sqlAdminLogin="$SQL_ADMIN_NAME" customDomain="${CUSTOM_DOMAIN_NAME:-}" \
            overrideLeagueName="${OVERRIDE_LEAGUE_NAME:-}" \
            -o json > out.json
          for k in functionAppName functionAppUrl staticWebAppName staticWebAppUrl sqlServerFqdn sqlDatabaseName; do
            echo "$k=$(jq -r ".properties.outputs.$k.value" out.json)" >> "$GITHUB_OUTPUT"
          done

  # schema before the code that expects it
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: infra
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dotnet
      - run: dotnet tool install --global dotnet-ef --version 10.0.12
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # no firewall rule for the runner: GitHub's hosted runners are in Azure, so
      # the server's "allow Azure services" rule admits them (tested, A31)
      - name: Apply migrations
        env:
          ConnectionStrings__FantasyLeague: "Server=tcp:${{ needs.infra.outputs.sqlServerFqdn }},1433;Database=${{ needs.infra.outputs.sqlDatabaseName }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=90;"
        run: dotnet ef database update --project src/FantasyLeague.Data --startup-project src/FantasyLeague.Data

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [infra, migrate]
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dotnet
      - run: dotnet publish -c Release --no-restore -o publish -p:SourceRevisionId=${{ github.sha }} src/FantasyLeague.Functions/FantasyLeague.Functions.csproj
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: publish
          artifact-name: sbom-functions.spdx.json
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ needs.infra.outputs.functionAppName }}
          package: publish
      # waits for this run's build by its X-Build header, through the cold start
      # and a storage role assignment that has not reached the host yet
      - name: Smoke
        env:
          API: ${{ needs.infra.outputs.functionAppUrl }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS -D headers.txt -o season.json "$API/api/season" \
               && grep -qi "^x-build: $GITHUB_SHA" headers.txt; then
              jq -e '.teams | length > 0' season.json
              exit 0
            fi
            sleep 15
          done
          echo "::error::$API never served this run's build ($GITHUB_SHA)"
          exit 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: infra
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # the page calls the Function App directly; the SWA has no linked backend
      - run: npm run build --prefix web
        env:
          VITE_API_ORIGIN: ${{ needs.infra.outputs.functionAppUrl }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # the upload token is read for this run through OIDC and masked, so no
      # deployment credential is stored in GitHub
      - id: swa
        env:
          RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP_NAME }}
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list -n '${{ needs.infra.outputs.staticWebAppName }}' -g "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          api_location: ''
      # the site keeps serving the previous index.html for a while after the
      # upload, so wait for the asset this run built
      - name: The site serves this run's bundle
        env:
          SITE: ${{ needs.infra.outputs.staticWebAppUrl }}
        run: |
          expected=$(grep -m1 -o "/assets/[^\"]*[.]js" web/dist/index.html)
          for _ in $(seq 1 20); do
            if curl -fsS "$SITE" -o index.html && grep -qF "$expected" index.html; then exit 0; fi
            sleep 6
          done
          echo "::error::$SITE never served this run's bundle ($expected)"
          exit 1

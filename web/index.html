<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <title>Fantasy Standings</title>
    <style>
      /* overlay shown while loading: a football thrown side to side */
      #boot {
        /* the arc is centred halfway between the masthead's bottom and the top of the Skeleton's title */
        --boot-mid: calc(4rem + (100svh - 4rem - 283px) / 4);
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        animation: boot-fadein 0.25s ease 0.4s forwards;
      }

      #boot .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @keyframes boot-fadein {
        to {
          opacity: 1;
        }
      }

      /* the ball arcs from side to side */
      #boot .ball {
        position: absolute;
        top: max(calc(4rem + 26px), calc(var(--boot-mid) - 19.2px));
        left: 0;
        width: 64px;
        overflow: visible;
        animation:
          boot-arc-x 2.2s cubic-bezier(0.37, 0, 0.63, 1) infinite,
          boot-arc-y 2.2s cubic-bezier(0.37, 0, 0.63, 1) infinite,
          boot-flip 2.2s steps(1) infinite;
      }
      @keyframes boot-arc-x {
        0% {
          left: 0;
        }
        50% {
          left: calc(100% - 64px);
        }
        100% {
          left: 0;
        }
      }
      @keyframes boot-arc-y {
        0%,
        50%,
        100% {
          translate: 0 18px;
        }
        25%,
        75% {
          translate: 0 -18px;
        }
      }
      /* steps(1) holds each value until the next keyframe, so the flip lands
         exactly on 0%/50%/100% - the instants the ball reaches an edge and
         its horizontal speed is already ~0, same trick as the old apex flip */
      @keyframes boot-flip {
        0% {
          scale: 1 1;
        }
        50% {
          scale: -1 1;
        }
        100% {
          scale: 1 1;
        }
      }

      /* a spiral turns the ball about its long axis */
      #boot .laces {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-roll 0.6s linear infinite;
      }
      @keyframes boot-roll {
        0% {
          transform: translateY(6.5px) scaleY(0.02);
        }
        8.33% {
          transform: translateY(5.63px) scaleY(0.5);
        }
        16.67% {
          transform: translateY(3.25px) scaleY(0.87);
        }
        25% {
          transform: translateY(0) scaleY(1);
        }
        33.33% {
          transform: translateY(-3.25px) scaleY(0.87);
        }
        41.67% {
          transform: translateY(-5.63px) scaleY(0.5);
        }
        50% {
          transform: translateY(-6.5px) scaleY(0.02);
        }
        /* far side: jump back to the bottom while flattened to nothing */
        50.01%,
        100% {
          transform: translateY(6.5px) scaleY(0.02);
        }
      }

      #boot .speed {
        animation: boot-streak 0.35s ease-in-out infinite;
      }
      #boot .speed path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.2;
        opacity: 0.25;
        color: #7a4a24;
      }
      @keyframes boot-streak {
        0%,
        100% {
          opacity: 0.15;
        }
        50% {
          opacity: 0.5;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .ball,
        #boot .laces,
        #boot .speed {
          animation: none;
        }
        #boot .ball {
          left: calc(50% - 32px);
          translate: 0 0;
          scale: 1 1;
        }
        #boot .speed {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <svg class="ball" viewBox="0 0 40 24" aria-hidden="true">
        <defs>
          <!-- two cubics meeting at slightly pointed ends make a football -->
          <path id="boot-shape" d="M9 12 C11.5 2.93 28.5 2.93 31 12 C28.5 21.07 11.5 21.07 9 12Z" />
          <clipPath id="boot-skin">
            <use href="#boot-shape" />
          </clipPath>
        </defs>

        <g class="speed">
          <path d="M6 8 q-5 4 0 8" />
          <path d="M1 10 q-4 2 0 4" />
        </g>

        <use href="#boot-shape" fill="#7A4A24" />

        <g clip-path="url(#boot-skin)">
          <path
            class="laces"
            d="M15.5 12h9M17 10.8v2.4M19 10.8v2.4M21 10.8v2.4M23 10.8v2.4"
            stroke="#F6F1E8"
            stroke-width="0.9"
            stroke-linecap="round"
          />
        </g>
      </svg>

      <span class="sr">Loading standings</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
